  else P.push(m.from[1]===(w?"1":"8")?"Develops the bishop onto an open diagonal.":"Repositions the bishop on a more active diagonal.")}
 else if(m.piece==="r")P.push("Activates the rook on an open or semi-open file.");
 else if(m.piece==="q")P.push("An early queen move can be chased with tempo, so it is only worth it when theory backs it.");
 if(m.captured&&m.piece!=="p")P.push("Captures a "+N[m.captured]+".");
 if(s.includes("+"))P.push("Gives check, forcing a reply.");
 const rk=i===0?"Main line: the book’s top recommendation here and a solid practical choice.":i<3?"Common alternative: fully playable, but it leads to a different structure than the main line.":"Sideline: less common. Fine to play, but it asks you to know more specific theory.";
 return `<p><b>${rk}</b></p>`+P.map(t=>`<p>${t}</p>`).join("")+(x.name?`<p><b>Leads to ${x.name}.</b> ${x.idea||""}</p>`:"")}
const BK="#a88865",BI='<svg viewBox="0 0 16 16"><path d="M2 3.5C4 2.5 6.5 2.5 8 3.8 9.5 2.5 12 2.5 14 3.5V12.5C12 11.5 9.5 11.5 8 12.8 6.5 11.5 4 11.5 2 12.5Z" fill="#fff"/><path d="M8 3.8V12.8" stroke="#a88865"/></svg>';
let AC=null,MG=null,muted=false;
function noise(d){const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;return b}
function tock(t,g,f,cap){
 const s=AC.createBufferSource();s.buffer=noise(.1);
 const bp=AC.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=cap?.9:1.5;
 const ga=AC.createGain();ga.gain.setValueAtTime(g*1.6,t);ga.gain.exponentialRampToValueAtTime(.001,t+(cap?.1:.06));
 s.connect(bp);bp.connect(ga);ga.connect(MG);s.start(t);
 const o=AC.createOscillator(),og=AC.createGain();o.type="sine";o.frequency.setValueAtTime(cap?230:180,t);o.frequency.exponentialRampToValueAtTime(70,t+.08);
 og.gain.setValueAtTime(g*.7,t);og.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(og);og.connect(MG);o.start(t);o.stop(t+.13)}
function ping(t,f){const o=AC.createOscillator(),og=AC.createGain();o.type="sine";o.frequency.value=f;og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.16,t+.01);og.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(og);og.connect(MG);o.start(t);o.stop(t+.4)}
function snd(k){if(muted)return;try{
 if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.8;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination)}
 if(AC.state==="suspended")AC.resume();
 const t=AC.currentTime+.01;
 if(k==="c"){tock(t,1,1000);tock(t+.12,1,850)}else if(k==="x")tock(t,1.4,1300,1);else tock(t,1,950);
 if(k==="+")ping(t+.06,880);
 if(k==="#"){ping(t+.1,523);ping(t+.3,392)}
}catch(e){}}
const kd=r=>r.san.includes("#")?"#":r.san.includes("+")?"+":/[kq]/.test(r.flags)?"c":/[ce]/.test(r.flags)?"x":"m";
function play(s){const f0=g.fen(),r=g.move(s);if(r){redo=[];sel=null;const hs=g.history().join(" ");if(!walk().nd&&!R[hs])rate(f0,r.san,hs);render();snd(kd(r))}return r}
function board(){
 const b=g.board(),h=g.history({verbose:true}),lm=h.length?h[h.length-1]:null,rb=lm&&R[h.map(x=>x.san).join(" ")],bk=lm&&!rb&&walk().nd;
 const targets=sel?g.moves({square:sel,verbose:true}):[];
 let out="";
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){
  const rr=flip?7-r:r,ff=flip?7-f:f,sq="abcdefgh"[ff]+(8-rr),p=b[rr][ff];
  const t=targets.find(m=>m.to===sq);
  const cl=["sq",(rr+ff)%2?"d":"",(lm&&(lm.from===sq||lm.to===sq))||sel===sq?"l":"",t?(p?"t tc":"t"):"",pvSq&&pvSq.includes(sq)?"v":""].join(" ");
  out+=`<div class="${cl}" data-sq="${sq}">${p?`<svg class="pc ${p.color}" viewBox="0 0 45 45"><use href="#s-${p.type}"/></svg>`:""}${rb&&!rb.w&&lm.to===sq?`<span class="bd" style="background:${CO[rb.c]}">${TT[rb.c]}</span>`:""}${bk&&lm.to===sq?`<span class="bd" style="background:${BK}">${BI}</span>`:""}</div>`}
 $("board").innerHTML=out;let RK="",FL="";for(let i=0;i<8;i++){RK+=`<span>${flip?i+1:8-i}</span>`;FL+=`<span>${"abcdefgh"[flip?7-i:i]}</span>`}$("ranks").innerHTML=RK;$("files").innerHTML=FL}
function render(){
 const H=g.history(),hs=H.join(" "),op=openPos===hs?openS:null,pm=op&&g.moves({verbose:true}).find(m=>m.san===op);pvSq=pm?[pm.from,pm.to]:null;
 board();
 const{nd,nm}=walk();const rv=R[hs],rc=$("rc");const th=!rv&&H.length&&nd&&nm;rc.hidden=!(rv||th);if(th)rc.innerHTML=`<h1>Your move · theory</h1><p class="nm" style="font-size:19px"><span class="rb" style="background:${BK}">${BI}</span>${H[H.length-1]} is a theory move</p><p class="idea">You’re following known ${nm.name} theory. The suggestions below show where it goes next.</p>`;if(rv){rc.innerHTML=rtxt(rv,H[H.length-1]);const tb=rc.querySelector("button");if(tb)tb.onclick=()=>{g.undo();play(rv.best)}}
 $("nm").textContent=nm?nm.name:(H.length?"Out of book":"Starting position");
 $("idea").textContent=nm?nm.idea:(H.length?"":"Pick a first move to begin exploring theory.");
 let mv="";H.forEach((s,i)=>{mv+=(i%2?"":(i/2+1)+". ")+s+" "});$("mv").textContent=mv;
 const box=$("sg");box.innerHTML="";
 $("sh").textContent=g.turn()==="w"?"Best moves for White":"Best moves for Black";
 if(!nd){box.innerHTML='<p class="idea">This position has left my opening book. Step back to return to known theory.</p>';const bt=document.createElement("button");bt.textContent="Back to book";bt.onclick=()=>{while(!walk().nd)g.undo();sel=null;render()};box.appendChild(bt)}
 else if(!nd.o.length){box.innerHTML='<p class="idea">Theory in this book ends here. Keep developing, fight for the center and castle.</p>'}
 else nd.o.forEach((s,i)=>{
  let x=nd.c[s];while(!x.name&&x.o.length)x=x.c[x.o[0]];
  const row=document.createElement("div");row.className="row";const bt=document.createElement("button");bt.className="sg";
  bt.innerHTML=`<b>${pre()}${s}</b><span class="n">${x.name||""}</span><span class="tag ${i?"":"m"}">${i===0?"Main line":i<3?"Common":"Sideline"}</span>`;
  bt.onclick=()=>play(s);const wb=document.createElement("button");wb.textContent=op===s?"Hide":"Why?";wb.onclick=()=>{openS=op===s?null:s;openPos=hs;render()};row.append(bt,wb);if(op===s){const ex=document.createElement("div");ex.className="ex";ex.innerHTML=why(s,i,x);row.appendChild(ex)}box.appendChild(row)});
 if(g.game_over()){box.innerHTML='<p class="idea">Game over.</p>'}}
$("board").onclick=e=>{
 const el=e.target.closest(".sq");if(!el)return;const sq=el.dataset.sq;
 if(sel){const m=g.moves({square:sel,verbose:true}).find(m=>m.to===sq);if(m){play({from:sel,to:sq,promotion:"q"});return}}
 const p=g.get(sq);sel=p&&p.color===g.turn()?sq:null;board()};
$("back").onclick=()=>{const m=g.undo();if(m){redo.push(m.san);sel=null;render();snd("m")}};
$("fwd").onclick=()=>{const s=redo.pop();if(s){const r=g.move(s);sel=null;render();if(r)snd(kd(r))}};
$("reset").onclick=()=>{g.reset();redo=[];sel=null;render()};
$("flip").onclick=()=>{flip=!flip;board()};
$("sty").onclick=()=>$("frame").classList.toggle("green");
$("sbtn").onclick=e=>{muted=!muted;e.target.textContent=muted?"Sound: off":"Sound: on";snd("m")};
function list(){const q=$("q").value.toLowerCase();$("list").innerHTML="";
 named.filter(o=>o.n.toLowerCase().includes(q)).forEach(o=>{const b=document.createElement("button");b.textContent=o.n;b.title=o.path.join(" ");
  b.onclick=()=>{g.reset();o.path.forEach(s=>g.move(s));redo=[];sel=null;render();snd("m")};$("list").appendChild(b)})}
$("q").oninput=list;list();render();
</script></body></html>
